<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>COAST Geovisor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo-inst3.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght=400;600;700;900&display=swap');
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #e7ebee;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .dashboard-panel {
      background: #ffffff;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .panel-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.75rem;
      font-weight: 800;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .panel-content {
      flex: 1;
      padding: 1.25rem;
      overflow-y: auto;
    }

    .map-btn {
      width: 100%;
      text-align: left;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #f1f5f9;
      background: #f8fafc;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
      color: #64748b;
    }

    .map-btn:hover {
      background: #eff6ff;
      color: #1e40af;
      border-color: #bfdbfe;
    }

    .map-btn.active {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    .custom-check {
      accent-color: #1e40af;
      width: 1rem;
      height: 1rem;
    }
  </style>
</head>
<body>

  <div id="app" class="h-full flex flex-col overflow-hidden">

    <header class="h-16 border-b border-slate-800 bg-[#0f172a]/95 flex items-center justify-between px-6 z-50 rounded-xl m-2 shadow-lg shrink-0">
        <div class="flex items-center gap-3 w-1/3">
            <img src="logo-inst1.png" alt="Logo" class="h-6 w-auto">
            <span class="text-white font-bold text-sm">Geovisor Interactivo</span>
        </div>
        <div class="flex items-center justify-end gap-3 w-1/3">
            <a href="index.html" class="px-3 py-1.5 rounded-lg text-[12px] font-bold text-white hover:bg-slate-700 transition-all flex items-center gap-2 no-underline">
                <i class="fa-solid fa-home"></i> Inicio
            </a>
        </div>
    </header>

    <div class="flex-1 px-4 pb-4 grid grid-cols-12 grid-rows-6 gap-4 overflow-hidden">
      
      <div class="col-span-3 row-span-6 flex flex-col gap-4">
        <div class="flex-1 dashboard-panel">
          <div class="panel-header"><i class="fas fa-layer-group text-blue-600"></i> Mapas Base</div>
          <div class="panel-content">
            
            <div class="space-y-1">
              <button @click="cambiarFondo('esri')" :class="['map-btn', { active: mapaBaseActivo === 'esri' }]">Esri World Imagery</button>
              <button @click="cambiarFondo('osm')" :class="['map-btn', { active: mapaBaseActivo === 'osm' }]">OpenStreetMap</button>
              <button @click="cambiarFondo('arcgis')" :class="['map-btn', { active: mapaBaseActivo === 'arcgis' }]">ArcGIS Terrain</button>
              <button @click="cambiarFondo('google')" :class="['map-btn', { active: mapaBaseActivo === 'google' }]">Google Hybrid Style</button>
            </div>
            
            <div class="mt-6">
              <p class="text-[14px] font-black text-slate-400 tracking-widest mb-3">Capas Temáticas</p>
              <div class="space-y-3">
                <label class="flex items-center gap-3 text-xs font-semibold text-slate-700 cursor-pointer">
                  <input type="checkbox" class="custom-check" v-model="capasActivas.rasterClusters"> 
                  Modelo de Clústeres Interpolados (Raster)
                </label>
                <label class="flex items-center gap-3 text-xs font-semibold text-slate-700 cursor-pointer">
                  <input type="checkbox" class="custom-check" v-model="capasActivas.mcsi"> 
                  Índice de Susceptibilidad Marino - Costera (MCSI)
                </label>
                <label class="flex items-center gap-3 text-xs font-semibold text-slate-700 cursor-pointer">
                  <input type="checkbox" class="custom-check" v-model="capasActivas.esi"> 
                  Índice de Sensibilidad Ecológica (ESI)
                </label>
              </div>
            </div>

          </div>
        </div>

        <div class="h-1/3 dashboard-panel">
          <div class="panel-header"><i class="fas fa-chart-bar text-blue-600"></i> Gráficos y Análisis</div>
          <div class="panel-content flex items-center justify-center text-center">
            <p class="text-slate-400 italic text-[11px]">Seleccione un área en el mapa.</p>
          </div>
        </div>
      </div>

      <div class="col-span-6 row-span-6 dashboard-panel !p-1">
        <map-view ref="referenciaMapa" :visibilidad="capasActivas"></map-view>
      </div>

      <div class="col-span-3 row-span-6 flex flex-col gap-4">
        <div class="flex-1 dashboard-panel">
          <div class="panel-header"><i class="fas fa-list-ul text-blue-600"></i> Visualización de Datos</div>
          <div class="panel-content">
            <table class="w-full text-left text-[12px]">
              <thead class="border-b border-slate-100">
                <tr><th class="pb-2">Región</th><th class="pb-2 text-right">Índice MCSI</th></tr>
              </thead>
              <tbody class="text-slate-600">
                <tr v-for="item in tableMcsi" :key="item.region" class="border-b border-slate-50">
                  <td class="py-2.5 font-semibold">{{ item.region }}</td>
                  <td :class="['py-2.5 text-right font-bold', item.color]">{{ item.valor }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="h-1/4 dashboard-panel">
          <div class="panel-header"><i class="fas fa-info-circle text-blue-600"></i> Créditos</div>
          <div class="panel-content">
            <p class="text-[11px] font-bold text-slate-800 uppercase">Proyecto COAST</p>
            <p class="text-[10px] text-slate-500">Desarrollado por el SEI-LA.</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          mapaBaseActivo: 'osm',
          // El objeto de la verdad: controla la reactividad del mapa al instante
          capasActivas: {
            rasterClusters: false,
            mcsi: false,
            esi: false
          },
          tableMcsi: [
            { region: 'Zona Norte A', valor: '0.92', color: 'text-red-600' },
            { region: 'Zona Central B', valor: '0.74', color: 'text-yellow-600' },
            { region: 'Zona Sur C', valor: '0.45', color: 'text-green-600' }
          ]
        }
      },
      methods: {
        cambiarFondo(key) {
          this.mapaBaseActivo = key;
          // Llama directamente al método del componente MapView
          this.$refs.referenciaMapa.setBasemap(key);
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
